[project]
name = "pathfrontier"
version = "0.1.0"
description = "Make your own frontier: pathology tile classification cascade (foundation encoder + linear probe + VLM) with cost/sensitivity frontier evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pillow>=10",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.40",
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0.9",
    "transformers>=4.44",
    "gradio>=4.40",
    "joblib>=1.4",
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pathfrontier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: needs network / model downloads (run with -m slow)"]

[tool.ruff]
line-length = 100
